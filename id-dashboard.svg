<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&amp;family=Inter:wght@700&amp;display=swap');
      .bg { fill: #0d0e16; }
      .card { fill: #131625; stroke: rgba(255,255,255,0.08); stroke-width: 1; rx: 12px; }
      .text-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 16px; fill: #ffffff; }
      .text-mono { font-family: 'Fira Code', monospace; font-size: 11px; fill: #94a3b8; }
      
      /* Bar Chart Styles */
      .bar-bg { fill: rgba(255,255,255,0.05); rx: 4px; }
      .bar-fill { fill: #22d3ee; rx: 4px; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="16"/>

  <!-- Left: Holographic ID Badge -->
  <g transform="translate(30, 20)">
    <rect width="220" height="260" rx="12" fill="#181c2e" stroke="rgba(255,255,255,0.15)"/>
    
    <!-- Lanyard Slot -->
    <rect x="90" y="10" width="40" height="8" rx="4" fill="#0d0e16"/>
    
    <!-- Portrait Frame -->
    <image href="./face2.jpg" x="35" y="30" width="150" height="130" preserveAspectRatio="xMidYMid slice" clip-path="inset(0 round 8px)"/>
    
    <!-- Badge Meta -->
    <text x="110" y="180" class="text-title" text-anchor="middle" font-size="14">Saral Shah</text>
    <text x="110" y="198" class="text-mono" text-anchor="middle" fill="#22d3ee">FULL STACK DEV</text>
    
    <!-- Barcode Simulation -->
    <g transform="translate(35, 215)">
      <rect x="0" y="0" width="150" height="20" fill="#ffffff" rx="2" opacity="0.9"/>
      <path d="M 10 0 V 20 M 15 0 V 20 M 18 0 V 20 M 24 0 V 20 M 30 0 V 20 M 40 0 V 20 M 48 0 V 20 M 55 0 V 20 M 65 0 V 20 M 75 0 V 20 M 85 0 V 20 M 98 0 V 20 M 110 0 V 20 M 125 0 V 20 M 138 0 V 20" stroke="#000000" stroke-width="2"/>
    </g>
  </g>

  <!-- Right: Key Dashboard & Project Metrics -->
  <g transform="translate(280, 20)">
    <rect width="590" height="260" class="card"/>
    <text x="24" y="40" class="text-title">📊 System Activity &amp; Repository Stats</text>

    <!-- Top KPI Cards -->
    <g transform="translate(24, 60)">
      <rect width="160" height="60" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)"/>
      <text x="16" y="25" class="text-mono">PRIMARY STACK</text>
      <text x="16" y="48" class="text-title" fill="#22d3ee">JS / Python</text>
    </g>

    <g transform="translate(200, 60)">
      <rect width="160" height="60" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)"/>
      <text x="16" y="25" class="text-mono">FOCUS AREA</text>
      <text x="16" y="48" class="text-title" fill="#a78bfa">Web &amp; AI Integration</text>
    </g>

    <g transform="translate(376, 60)">
      <rect width="180" height="60" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)"/>
      <text x="16" y="25" class="text-mono">STATUS</text>
      <text x="16" y="48" class="text-title" fill="#f472b6">Building Products</text>
    </g>

    <!-- Repo Activity Bar Chart -->
    <g transform="translate(24, 150)">
      <text x="0" y="0" class="text-mono">Rehab Flow</text>
      <rect x="120" y="-10" width="420" height="12" class="bar-bg"/>
      <rect x="120" y="-10" width="360" height="12" class="bar-fill"/>

      <text x="0" y="30" class="text-mono">YourRightHand</text>
      <rect x="120" y="20" width="420" height="12" class="bar-bg"/>
      <rect x="120" y="20" width="290" height="12" class="bar-fill" fill="#a78bfa"/>

      <text x="0" y="60" class="text-mono">Hapvider Portal</text>
      <rect x="120" y="50" width="420" height="12" class="bar-bg"/>
      <rect x="120" y="50" width="220" height="12" class="bar-fill" fill="#f472b6"/>
    </g>
  </g>
</svg>
